<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script src="control.js"></script>
		<style>
			@font-face {
				font-family: 'Noto Sans SC';
				font-style: normal;
				font-weight: normal;
				src: url('NotoSansSC-Regular.ttf') format('truetype');
			}

			body {
				text-align: center;
			}

			#disp-box {
				font: 4em 'Noto Sans SC', sans-serif;
				/*white-space: nowrap;
				overflow-x: auto;
				overflow-y: hidden;*/
			}
			.show { opacity: 1; }
			.hide { opacity: 0; }

			.control { font-size: 1.5rem; }
			#disp-index { width: 5em; }
		</style>
	</head>
	<body>
		<input class='control' id='disp-index' disabled='' inputmode='numeric' type='number' min='0'></input>
		<div>
			<button class='control' id='btn-prev' disabled='' type='button'>&lt;</button>
			<button class='control' id='btn-toggle-vis' disabled='' type='button'>show/hide</button>
			<button class='control' id='btn-next' disabled='' type='button'>&gt;</button>
		</div>
		<div id='disp-box' class='show'>　</div>
	</body>
</html>
